name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: node --test tests/*.test.js
      - run: python scripts/static_check.py
      - run: python -m py_compile scripts/dev_server.py scripts/static_check.py
